name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Enable FRP Module & Download Dependencies
        run: |
          go work use ./modules/tunnel-frp
          cd modules/tunnel-frp
          go mod tidy
          cd ../..

      - name: Generate Windows Resources (Icon & Manifest)
        run: |
          go install github.com/tc-hib/go-winres@latest
          cd core
          go-winres make --arch amd64
          cd ..

      - name: Build Windows Executable
        run: |
          mkdir -p build
          # -H=windowsgui ensures the app runs silently without a console window
          # -tags "production,frp" disables Wails v3 devtools and context menus at native WebView2 level
          go build -tags "production,frp" -ldflags "-H=windowsgui -s -w" -o build/DeskNotify.exe ./core

      - name: Sign Windows Executable (Authenticode)
        if: env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))

          # Find signtool.exe in Windows SDK
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found in Windows Kits!"
            exit 1
          }
          Write-Host "Found SignTool at: $signtool"

          # Sign binary with SHA256, RFC3161 timestamp, software name and project URL
          & $signtool sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "DeskNotify 传纸条" /du "https://github.com/lihugang/DeskNotify" build/DeskNotify.exe

          # Temporarily install root CA to Runner's Trusted Root store so Authenticode verification succeeds
          certutil -addstore -f Root certs/Lihugang-CA.cer

          # Verify signature
          & $signtool verify /pa /v build/DeskNotify.exe

          # Securely cleanup temporary PFX file
          Remove-Item $pfxPath -Force

      - name: Package Release Assets
        shell: pwsh
        run: |
          Copy-Item certs/Lihugang-CA.cer build/
          Copy-Item certs/install_ca.cmd "build/一键安装作者根证书(右键管理员运行).cmd"
          Compress-Archive -Path build/* -DestinationPath build/DeskNotify-Windows-x64.zip -Force

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/DeskNotify.exe
            build/DeskNotify-Windows-x64.zip
            build/Lihugang-CA.cer
            build/一键安装作者根证书(右键管理员运行).cmd
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
